<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de PCR / RCE</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- TELA DE ATENDIMENTO -->
  <div id="mainScreen" class="app-container">
    
    <!-- Cabeçalho com Luz do Ritmo e Cronômetro -->
    <header class="pcr-header">
      <div class="status-container">
        <span class="status-light pulse-red" id="statusIndicator"></span>
        <span class="status-text">PCR em andamento</span>
      </div>
      <div class="timer-display" id="mainTimer">00:00:00</div>
    </header>

    <!-- Área de Alertas Automáticos de Medicação -->
    <div id="medAlertBox" class="alert-box hidden">
      <span id="alertMessage">--</span>
    </div>

    <!-- Ações e Registros do Protocolo -->
    <main class="controls-grid">
      <button class="btn btn-action" onclick="registerEvent('Choque / Desfibrilação')">⚡ Choque (DEA / Monitor)</button>
      <button class="btn btn-action" onclick="handleAmiodarona()">💊 Amiodarona</button>
      <button class="btn btn-action" onclick="handleAdrenalina()">💉 Adrenalina (1mg)</button>
      <button class="btn btn-action" onclick="registerEvent('Acesso EV/IO estabelecido')">🩺 Acesso EV/IO</button>
      <button class="btn btn-action" onclick="registerEvent('Via Aérea Avançada')">🫁 Via Aérea Avançada</button>
      
      <!-- Botão de Finalização para RCE -->
      <button class="btn btn-rce" onclick="finishRCE()">✅ RCE (Circulação Espontânea)</button>
    </main>

    <!-- Visualização Rápida dos Registros -->
    <section class="live-timeline">
      <h3>Registros Recentes</h3>
      <ul id="liveLogList"></ul>
    </section>

  </div>

  <!-- TELA DE RELATÓRIO FINAL -->
  <div id="reportScreen" class="app-container hidden">
    <h2>Relatório de Atendimento</h2>

    <!-- Resumo dos Tempos (Sem Status de Óbito) -->
    <div class="summary-card">
      <div class="time-info">
        <span><strong>Início:</strong> <span id="startTimeDisplay">--:--</span></span>
        <span class="separator">|</span>
        <span><strong>Término:</strong> <span id="endTimeDisplay">--:--</span></span>
      </div>
      <div class="duration-info">
        <span><strong>Duração Total:</strong> <span id="totalDurationDisplay">00:00:00</span></span>
      </div>
    </div>

    <h3>Linha do Tempo Completa</h3>
    <div class="timeline-box">
      <ul id="reportLogList"></ul>
    </div>

    <!-- Ações de Exportação -->
    <div class="action-buttons">
      <button class="btn btn-primary" onclick="copySummary()">📋 Copiar Resumo</button>
      <button class="btn btn-success" onclick="sendEmail()">✉️ Enviar por E-mail</button>
      <button class="btn btn-secondary" onclick="resetApp()">← Novo Atendimento</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
